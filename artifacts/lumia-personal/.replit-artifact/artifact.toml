kind = "web"
previewPath = "/"
title = "Stream Lights"
version = "1.0.0"
id = "artifacts/lumia-personal"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 21764

[services.development]
run = "pnpm --filter @workspace/lumia-personal run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/lumia-personal", "run", "build" ]
publicDir = "artifacts/lumia-personal/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "21764"
BASE_PATH = "/"
