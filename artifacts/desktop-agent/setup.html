<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Stream Lights Agent — Setup</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #0f0f1a;
      color: #e2e8f0;
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }
    .card {
      background: #1a1a2e;
      border: 1px solid #2d2d4e;
      border-radius: 16px;
      padding: 36px;
      width: 100%;
      max-width: 440px;
    }
    .logo {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 28px;
    }
    .logo-icon {
      width: 40px; height: 40px;
      background: linear-gradient(135deg, #9147ff, #7c3aed);
      border-radius: 10px;
      display: flex; align-items: center; justify-content: center;
      font-size: 20px;
    }
    .logo h1 { font-size: 20px; font-weight: 700; color: #a855f7; }
    .logo p { font-size: 12px; color: #64748b; }
    label {
      display: block;
      font-size: 13px;
      font-weight: 500;
      color: #94a3b8;
      margin-bottom: 6px;
      margin-top: 16px;
    }
    input {
      width: 100%;
      padding: 10px 14px;
      background: #0f0f1a;
      border: 1px solid #2d2d4e;
      border-radius: 8px;
      color: #e2e8f0;
      font-size: 14px;
      outline: none;
      transition: border-color 0.2s;
    }
    input:focus { border-color: #7c3aed; }
    .hint { font-size: 11px; color: #475569; margin-top: 4px; }
    .btn {
      width: 100%;
      padding: 12px;
      background: linear-gradient(135deg, #7c3aed, #9147ff);
      border: none;
      border-radius: 8px;
      color: white;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      margin-top: 24px;
      transition: opacity 0.2s;
    }
    .btn:hover { opacity: 0.9; }
    .btn:disabled { opacity: 0.5; cursor: not-allowed; }
    .error {
      background: #3f1111;
      border: 1px solid #7f1d1d;
      border-radius: 8px;
      padding: 10px 14px;
      font-size: 13px;
      color: #fca5a5;
      margin-top: 16px;
      display: none;
    }
    .success {
      background: #052e16;
      border: 1px solid #166534;
      border-radius: 8px;
      padding: 10px 14px;
      font-size: 13px;
      color: #86efac;
      margin-top: 16px;
      display: none;
    }
    .divider { border-top: 1px solid #2d2d4e; margin: 24px 0; }
    .section-title { font-size: 12px; font-weight: 600; color: #64748b; text-transform: uppercase; letter-spacing: 0.05em; margin-bottom: 4px; }
  </style>
</head>
<body>
  <div class="card">
    <div class="logo">
      <div class="logo-icon">⚡</div>
      <div>
        <h1>Stream Lights Agent</h1>
        <p>One-time setup — takes 30 seconds</p>
      </div>
    </div>

    <div class="section-title">Supabase Connection</div>
    <p class="hint">Find these in Supabase → Settings → API</p>

    <label>Project URL</label>
    <input id="url" type="text" placeholder="https://xxxx.supabase.co" />

    <label>Anon / Public Key</label>
    <input id="key" type="text" placeholder="eyJhbGciOiJIUzI1NiIs..." />

    <div class="divider"></div>
    <div class="section-title">Dashboard (optional)</div>

    <label>Your Vercel App URL</label>
    <input id="dashboard" type="text" placeholder="https://stream-lights.vercel.app" />
    <p class="hint">Used for the "Open Dashboard" tray menu item</p>

    <div class="error" id="error"></div>
    <div class="success" id="success"></div>

    <button class="btn" id="save" onclick="save()">Save & Start Agent</button>
  </div>

  <script>
    window.addEventListener('DOMContentLoaded', () => {
      const config = window.electronAPI?.getConfig?.() || {};
      if (config.supabaseUrl) document.getElementById('url').value = config.supabaseUrl;
      if (config.supabaseKey) document.getElementById('key').value = config.supabaseKey;
      if (config.dashboardUrl) document.getElementById('dashboard').value = config.dashboardUrl;
    });

    async function save() {
      const btn = document.getElementById('save');
      const err = document.getElementById('error');
      const ok = document.getElementById('success');
      err.style.display = 'none';
      ok.style.display = 'none';

      const url = document.getElementById('url').value.trim();
      const key = document.getElementById('key').value.trim();
      const dashboard = document.getElementById('dashboard').value.trim();

      if (!url || !key) {
        err.textContent = 'Supabase URL and Key are required.';
        err.style.display = 'block';
        return;
      }

      btn.disabled = true;
      btn.textContent = 'Testing connection...';

      try {
        const result = await window.electronAPI.saveConfig({ supabaseUrl: url, supabaseKey: key, dashboardUrl: dashboard });
        if (result.success) {
          ok.textContent = '✓ Connected! Agent is starting. You can close this window.';
          ok.style.display = 'block';
          btn.textContent = 'Done!';
        } else {
          err.textContent = result.error || 'Failed to connect. Check your credentials.';
          err.style.display = 'block';
          btn.disabled = false;
          btn.textContent = 'Save & Start Agent';
        }
      } catch (e) {
        err.textContent = 'Unexpected error: ' + e.message;
        err.style.display = 'block';
        btn.disabled = false;
        btn.textContent = 'Save & Start Agent';
      }
    }
  </script>
</body>
</html>
