<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Stream Lights Agent</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <style>
    /* ── Design tokens — exact match with the web app ─────────────────── */
    :root {
      --bg:           hsl(240,10%,4%);
      --card:         hsl(240,10%,6%);
      --card2:        hsl(240,10%,8%);
      --border:       hsl(240,10%,12%);
      --border2:      hsl(240,10%,16%);
      --primary:      hsl(270,100%,60%);
      --primary-10:   rgba(124,58,237,.10);
      --primary-20:   rgba(124,58,237,.20);
      --primary-glow: rgba(168,85,247,.40);
      --text:         hsl(240,10%,95%);
      --muted:        hsl(240,5%,60%);
      --subtle:       hsl(240,10%,32%);
      --success:      #22c55e;
      --success-10:   rgba(34,197,94,.08);
      --success-25:   rgba(34,197,94,.22);
      --error:        #ef4444;
      --error-10:     rgba(239,68,68,.09);
      --error-25:     rgba(239,68,68,.25);
      --radius:       8px;
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { width: 100%; height: 100%; overflow: hidden; }
    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      background: var(--bg);
      color: var(--text);
      -webkit-font-smoothing: antialiased;
      font-size: 13px;
    }
    a { color: var(--primary); text-decoration: none; }
    a:hover { opacity: .8; }

    /* ── Titlebar ─────────────────────────────────────────────────────── */
    .titlebar {
      height: 30px;
      background: var(--card);
      border-bottom: 1px solid var(--border);
      -webkit-app-region: drag;
      display: flex;
      align-items: center;
      padding: 0 10px;
      gap: 7px;
      flex-shrink: 0;
    }
    .tb-logo { color: var(--primary); display: flex; align-items: center; }
    .tb-logo svg { width: 11px; height: 11px; }
    .tb-name {
      font-size: 10.5px; font-weight: 700;
      text-transform: uppercase; letter-spacing: .1em;
      color: var(--subtle);
    }
    /* Windows-style system buttons */
    .tb-btns {
      margin-left: auto;
      display: flex; align-items: stretch;
      height: 100%;
      -webkit-app-region: no-drag;
    }
    .tb-btn {
      width: 42px; height: 100%;
      background: transparent; border: none;
      cursor: pointer; color: var(--subtle);
      display: flex; align-items: center; justify-content: center;
      transition: background .1s, color .1s;
      -webkit-app-region: no-drag; padding: 0;
    }
    .tb-btn:hover { background: rgba(255,255,255,.07); color: var(--text); }
    .tb-close-btn:hover { background: rgba(196,43,28,.9); color: #fff; }

    /* ── Scrollable body ─────────────────────────────────────────────── */
    .body {
      height: calc(100vh - 30px);
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      scrollbar-width: thin;
      scrollbar-color: var(--border2) transparent;
    }

    /* ── Brand header ─────────────────────────────────────────────────── */
    .brand {
      padding: 22px 22px 18px;
      border-bottom: 1px solid var(--border);
      display: flex; align-items: center; gap: 13px;
    }
    .brand-icon {
      width: 40px; height: 40px; border-radius: 10px; flex-shrink: 0;
      background: linear-gradient(135deg,hsl(270,100%,45%),hsl(270,100%,62%));
      box-shadow: 0 0 22px var(--primary-glow), inset 0 1px 0 rgba(255,255,255,.12);
      display: flex; align-items: center; justify-content: center;
    }
    .brand-icon svg { width: 20px; height: 20px; }
    .brand-info { flex: 1; }
    .brand-info h1 {
      font-size: 14px; font-weight: 800;
      letter-spacing: .07em; text-transform: uppercase;
      color: var(--primary); line-height: 1;
    }
    .brand-info p { font-size: 11px; color: var(--muted); margin-top: 3px; }

    /* ── Status pill ──────────────────────────────────────────────────── */
    .pill {
      display: inline-flex; align-items: center; gap: 5px;
      font-size: 10.5px; font-weight: 600;
      border-radius: 20px; padding: 3px 9px;
      white-space: nowrap;
    }
    .pill-dot { width: 5px; height: 5px; border-radius: 50%; }
    .pill-online {
      color: var(--success);
      background: var(--success-10);
      border: 1px solid var(--success-25);
    }
    .pill-online .pill-dot { background: var(--success); animation: blink 2s ease-in-out infinite; }
    .pill-offline {
      color: var(--muted);
      background: rgba(255,255,255,.03);
      border: 1px solid var(--border);
    }
    .pill-offline .pill-dot { background: var(--subtle); }
    @keyframes blink { 0%,100%{opacity:1}50%{opacity:.3} }

    /* ── Main content ─────────────────────────────────────────────────── */
    .content { padding: 18px 22px 22px; display: flex; flex-direction: column; gap: 14px; flex: 1; }

    /* ── 2×2 stat grid ───────────────────────────────────────────────── */
    .stats {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
    }
    .stat {
      background: var(--card2);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 11px 13px;
    }
    .stat-label {
      font-size: 10px; font-weight: 600;
      text-transform: uppercase; letter-spacing: .09em;
      color: var(--subtle); margin-bottom: 5px;
    }
    .stat-row { display: flex; align-items: center; gap: 6px; }
    .dot-on  { width: 6px; height: 6px; border-radius: 50%; background: var(--success); box-shadow: 0 0 5px rgba(34,197,94,.5); flex-shrink:0; }
    .dot-off { width: 6px; height: 6px; border-radius: 50%; background: var(--subtle); flex-shrink:0; }
    .stat-val { font-size: 20px; font-weight: 700; color: var(--text); line-height:1; }
    .stat-txt { font-size: 12px; color: var(--muted); }
    .stat-txt-on { font-size: 12px; color: var(--success); }

    /* ── Quick-fire test ─────────────────────────────────────────────── */
    .test-row {
      background: var(--card2);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 12px 13px;
      display: flex; align-items: center; gap: 12px;
    }
    .color-swatch {
      width: 34px; height: 34px; border-radius: 6px;
      border: 1px solid rgba(255,255,255,.1);
      position: relative; overflow: hidden; cursor: pointer; flex-shrink: 0;
      -webkit-app-region: no-drag;
    }
    .color-swatch input[type=color] {
      position: absolute; inset: -4px;
      opacity: 0; cursor: pointer;
      width: calc(100% + 8px); height: calc(100% + 8px);
      border: none; padding: 0;
    }
    .test-info { flex: 1; }
    .test-info strong { font-size: 12px; font-weight: 600; display: block; }
    .test-info span { font-size: 11px; color: var(--muted); }
    .test-fire {
      padding: 7px 13px;
      background: var(--primary-10);
      border: 1px solid var(--primary-20);
      border-radius: var(--radius);
      color: #a78bfa;
      font-family: inherit; font-size: 11.5px; font-weight: 600;
      cursor: pointer;
      transition: background .15s, border-color .15s, color .15s;
      display: flex; align-items: center; gap: 5px;
      -webkit-app-region: no-drag; white-space: nowrap;
    }
    .test-fire:hover:not(:disabled) { background: var(--primary-20); border-color: rgba(124,58,237,.4); color: #c4b5fd; }
    .test-fire:disabled { opacity: .45; cursor: not-allowed; }
    .test-fire svg { width: 11px; height: 11px; }

    /* ── Divider with label ───────────────────────────────────────────── */
    .divider {
      display: flex; align-items: center; gap: 10px;
      font-size: 10px; font-weight: 600; text-transform: uppercase; letter-spacing: .09em;
      color: var(--subtle);
    }
    .divider::before, .divider::after { content:''; flex:1; height:1px; background:var(--border); }

    /* ── Form fields ─────────────────────────────────────────────────── */
    .fields { display: flex; flex-direction: column; gap: 9px; }
    .field label { display: block; font-size: 11px; font-weight: 500; color: var(--muted); margin-bottom: 4px; }
    .field-wrap { position: relative; }
    .field-ico {
      position: absolute; left: 10px; top: 50%; transform: translateY(-50%);
      color: var(--subtle); pointer-events: none; display: flex; align-items: center;
    }
    .field-ico svg { width: 13px; height: 13px; }
    .field input {
      width: 100%; padding: 8px 10px 8px 32px;
      background: rgba(255,255,255,.035);
      border: 1px solid var(--border2);
      border-radius: var(--radius);
      color: var(--text); font-family: inherit; font-size: 13px; outline: none;
      transition: border-color .15s, background .15s, box-shadow .15s;
      -webkit-app-region: no-drag; user-select: text;
    }
    .field input::placeholder { color: var(--subtle); }
    .field input:focus {
      border-color: var(--primary);
      background: rgba(124,58,237,.05);
      box-shadow: 0 0 0 3px rgba(124,58,237,.12);
    }

    /* ── Advanced toggle ─────────────────────────────────────────────── */
    .adv-toggle {
      display: flex; align-items: center; gap: 5px;
      background: none; border: none; padding: 0;
      font-family: inherit; font-size: 10.5px; font-weight: 600;
      text-transform: uppercase; letter-spacing: .08em;
      color: var(--subtle); cursor: pointer;
      transition: color .15s;
      -webkit-app-region: no-drag;
    }
    .adv-toggle:hover { color: var(--muted); }
    .adv-toggle svg { width: 9px; height: 9px; transition: transform .2s; }
    .adv-toggle.open svg { transform: rotate(90deg); }

    /* ── Feedback ────────────────────────────────────────────────────── */
    .msg {
      display: none; align-items: flex-start; gap: 8px;
      border-radius: var(--radius); padding: 9px 12px;
      font-size: 12px; line-height: 1.5;
    }
    .msg.show { display: flex; }
    .msg svg { width: 13px; height: 13px; flex-shrink: 0; margin-top: 1px; }
    .msg-err  { background: var(--error-10);   border: 1px solid var(--error-25);   color: var(--error); }
    .msg-ok   { background: var(--success-10); border: 1px solid var(--success-25); color: var(--success); }

    /* ── Buttons ─────────────────────────────────────────────────────── */
    .btn-primary {
      width: 100%; padding: 10px 16px;
      background: var(--primary);
      border: 1px solid rgba(255,255,255,.1);
      border-radius: var(--radius);
      color: #fff; font-family: inherit; font-size: 13px; font-weight: 600;
      cursor: pointer;
      box-shadow: 0 0 22px var(--primary-glow), inset 0 1px 0 rgba(255,255,255,.1);
      display: flex; align-items: center; justify-content: center; gap: 7px;
      transition: opacity .15s, box-shadow .15s, transform .12s;
      -webkit-app-region: no-drag;
    }
    .btn-primary:hover:not(:disabled) {
      opacity: .9;
      box-shadow: 0 0 30px var(--primary-glow), inset 0 1px 0 rgba(255,255,255,.1);
      transform: translateY(-1px);
    }
    .btn-primary:active:not(:disabled) { transform: translateY(0); box-shadow: 0 0 12px var(--primary-glow); }
    .btn-primary:disabled { opacity: .45; cursor: not-allowed; }
    .btn-outline {
      width: 100%; padding: 9px 16px;
      background: transparent;
      border: 1px solid var(--border2);
      border-radius: var(--radius);
      color: var(--muted); font-family: inherit; font-size: 13px; font-weight: 500;
      cursor: pointer;
      display: flex; align-items: center; justify-content: center; gap: 7px;
      transition: border-color .15s, color .15s, background .15s;
      -webkit-app-region: no-drag;
    }
    .btn-outline:hover { border-color: rgba(255,255,255,.2); color: var(--text); background: rgba(255,255,255,.025); }

    /* loading state */
    .spin {
      display: none; width: 13px; height: 13px;
      border: 2px solid rgba(255,255,255,.3); border-top-color: #fff;
      border-radius: 50%; animation: spin .65s linear infinite;
    }
    @keyframes spin { to { transform:rotate(360deg); } }
    .is-loading .spin { display: block; }
    .is-loading .btn-lbl { display: none; }

    /* ── Footer ──────────────────────────────────────────────────────── */
    .footer {
      margin-top: auto;
      padding: 10px 22px;
      border-top: 1px solid var(--border);
      font-size: 10.5px; color: var(--subtle); text-align: center;
    }
  </style>
</head>
<body>

<!-- Titlebar -->
<div class="titlebar">
  <div class="tb-logo">
    <svg viewBox="0 0 24 24" fill="currentColor"><path d="M13 2L4.5 13.5H11.5L11 22L19.5 10.5H12.5L13 2Z"/></svg>
  </div>
  <span class="tb-name">Stream Lights</span>
  <div class="tb-btns">
    <button class="tb-btn" onclick="window.electronAPI?.minimizeWindow?.()" title="Minimize">
      <svg width="10" height="1" viewBox="0 0 10 1"><line x1="0" y1="0.5" x2="10" y2="0.5" stroke="currentColor" stroke-width="1.2"/></svg>
    </button>
    <button class="tb-btn" id="max-btn" onclick="window.electronAPI?.maximizeWindow?.()" title="Maximize / Restore">
      <svg width="9" height="9" viewBox="0 0 9 9" fill="none"><rect x="0.6" y="0.6" width="7.8" height="7.8" stroke="currentColor" stroke-width="1.2"/></svg>
    </button>
    <button class="tb-btn tb-close-btn" onclick="window.electronAPI?.closeWindow?.()" title="Close">
      <svg width="10" height="10" viewBox="0 0 10 10" fill="none"><line x1="1" y1="1" x2="9" y2="9" stroke="currentColor" stroke-width="1.4"/><line x1="9" y1="1" x2="1" y2="9" stroke="currentColor" stroke-width="1.4"/></svg>
    </button>
  </div>
</div>

<div class="body">

  <!-- Brand header -->
  <div class="brand">
    <div class="brand-icon">
      <svg viewBox="0 0 24 24" fill="white"><path d="M13 2L4.5 13.5H11.5L11 22L19.5 10.5H12.5L13 2Z"/></svg>
    </div>
    <div class="brand-info">
      <h1>Stream Lights</h1>
      <p>Desktop Background Agent</p>
    </div>
    <div id="status-pill" class="pill pill-offline">
      <div class="pill-dot"></div>
      <span id="pill-label">Offline</span>
    </div>
  </div>

  <div class="content">

    <!-- ── Connected panel ────────────────────────────────────────── -->
    <div id="connected-panel" style="display:none; flex-direction:column; gap:12px;">

      <!-- Stats grid -->
      <div class="stats">
        <div class="stat">
          <div class="stat-label">Kick</div>
          <div class="stat-row">
            <div id="kick-dot" class="dot-off"></div>
            <span id="kick-txt" class="stat-txt">Disconnected</span>
          </div>
        </div>
        <div class="stat">
          <div class="stat-label">Twitch</div>
          <div class="stat-row">
            <div id="twitch-dot" class="dot-off"></div>
            <span id="twitch-txt" class="stat-txt">Disconnected</span>
          </div>
        </div>
        <div class="stat">
          <div class="stat-label">Devices</div>
          <div class="stat-val" id="devices-val">—</div>
        </div>
        <div class="stat">
          <div class="stat-label">Triggers</div>
          <div class="stat-val" id="triggers-val">—</div>
        </div>
      </div>

      <!-- Quick fire test -->
      <div class="test-row">
        <div class="color-swatch" id="swatch" style="background:#ff00ff" title="Pick a colour">
          <input type="color" id="test-color" value="#ff00ff" oninput="onColor(this.value)" />
        </div>
        <div class="test-info">
          <strong>Quick Fire Test</strong>
          <span>Flash all your lights</span>
        </div>
        <button class="test-fire" id="fire-btn" onclick="fireTest()">
          <svg viewBox="0 0 24 24" fill="currentColor"><path d="M13 2L4.5 13.5H11.5L11 22L19.5 10.5H12.5L13 2Z"/></svg>
          Fire
        </button>
      </div>

      <!-- Dashboard -->
      <button class="btn-primary" onclick="openDash()">
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/>
          <rect x="14" y="14" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/>
        </svg>
        Open Dashboard
      </button>

      <div class="divider">Change Account</div>
    </div>
    <!-- end connected panel -->

    <!-- ── Sign-in form ───────────────────────────────────────────── -->
    <div class="fields">
      <div class="field">
        <label>Email</label>
        <div class="field-wrap">
          <span class="field-ico">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/>
              <polyline points="22,6 12,13 2,6"/>
            </svg>
          </span>
          <input id="inp-email" type="email" placeholder="you@example.com" autocomplete="email" spellcheck="false" />
        </div>
      </div>

      <div class="field">
        <label>Password</label>
        <div class="field-wrap">
          <span class="field-ico">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <rect x="3" y="11" width="18" height="11" rx="2" ry="2"/>
              <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
            </svg>
          </span>
          <input id="inp-pass" type="password" placeholder="••••••••" autocomplete="current-password" />
        </div>
      </div>

      <!-- Advanced (dashboard URL) -->
      <button class="adv-toggle" id="adv-btn" onclick="toggleAdv()" type="button">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
          <polyline points="9 18 15 12 9 6"/>
        </svg>
        Advanced
      </button>

      <div id="adv-panel" style="display:none">
        <div class="field">
          <label>Dashboard URL <span style="color:var(--subtle);font-weight:400">(optional)</span></label>
          <div class="field-wrap">
            <span class="field-ico">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <circle cx="12" cy="12" r="10"/><line x1="2" y1="12" x2="22" y2="12"/>
                <path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"/>
              </svg>
            </span>
            <input id="inp-url" type="url" placeholder="https://stream-lights.vercel.app" autocomplete="off" spellcheck="false" />
          </div>
        </div>
      </div>
    </div>

    <!-- Feedback -->
    <div class="msg msg-err" id="msg-err">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/>
      </svg>
      <span id="err-txt"></span>
    </div>
    <div class="msg msg-ok" id="msg-ok">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><polyline points="22 4 12 14.01 9 11.01"/>
      </svg>
      <span id="ok-txt"></span>
    </div>

    <!-- Submit -->
    <button class="btn-primary" id="save-btn" onclick="save()">
      <div class="spin"></div>
      <span class="btn-lbl" id="save-lbl">Sign In &amp; Start Agent</span>
    </button>

  </div><!-- /content -->

  <div class="footer">
    Use the same account you created on the
    <a href="#" onclick="openDash();return false;">dashboard</a>.
  </div>

</div><!-- /body -->

<script>
  var cfg = {};
  var testColorVal = '#ff00ff';
  var showAdv = false;

  window.addEventListener('DOMContentLoaded', function() {
    cfg = window.electronAPI?.getConfig?.() || {};
    var connected = cfg.isConnected ?? false;

    // Pre-fill form
    if (cfg.email) document.getElementById('inp-email').value = cfg.email;
    if (cfg.dashboardUrl && cfg.dashboardUrl !== 'https://stream-lights.vercel.app')
      document.getElementById('inp-url').value = cfg.dashboardUrl;

    if (connected) {
      // Status pill → online
      var pill = document.getElementById('status-pill');
      pill.className = 'pill pill-online';
      document.getElementById('pill-label').textContent = 'Online';

      // Show connected panel (fix display:none override)
      var panel = document.getElementById('connected-panel');
      panel.style.display = 'flex';

      // Platform dots
      setPlatform('kick',   cfg.kickConnected   ?? false);
      setPlatform('twitch', cfg.twitchConnected ?? false);

      // Counts
      if (cfg.devicesCount  != null) document.getElementById('devices-val').textContent  = cfg.devicesCount;
      if (cfg.triggersCount != null) document.getElementById('triggers-val').textContent = cfg.triggersCount;

      // Button label
      document.getElementById('save-lbl').textContent = 'Switch Account';
    }
  });

  function setPlatform(name, on) {
    var dot = document.getElementById(name + '-dot');
    var txt = document.getElementById(name + '-txt');
    dot.className = on ? 'dot-on' : 'dot-off';
    txt.className  = on ? 'stat-txt-on' : 'stat-txt';
    txt.textContent = on ? 'Connected' : 'Disconnected';
  }

  function onColor(val) {
    testColorVal = val;
    document.getElementById('swatch').style.background = val;
  }

  function fireTest() {
    var btn = document.getElementById('fire-btn');
    btn.disabled = true;
    btn.innerHTML = '<svg viewBox="0 0 24 24" width="11" height="11" fill="currentColor"><path d="M13 2L4.5 13.5H11.5L11 22L19.5 10.5H12.5L13 2Z"/></svg> Firing…';
    window.electronAPI?.testLight?.(testColorVal, 100, 'solid', 2000).catch(function(){});
    setTimeout(function() {
      btn.disabled = false;
      btn.innerHTML = '<svg viewBox="0 0 24 24" width="11" height="11" fill="currentColor"><path d="M13 2L4.5 13.5H11.5L11 22L19.5 10.5H12.5L13 2Z"/></svg> Fire';
    }, 2300);
  }

  function toggleAdv() {
    showAdv = !showAdv;
    document.getElementById('adv-panel').style.display = showAdv ? 'block' : 'none';
    document.getElementById('adv-btn').classList.toggle('open', showAdv);
  }

  function openDash() { window.electronAPI?.openDashboard?.(); }

  function hideMsg() {
    document.getElementById('msg-err').classList.remove('show');
    document.getElementById('msg-ok').classList.remove('show');
  }
  function showErr(t) {
    document.getElementById('err-txt').textContent = t;
    document.getElementById('msg-ok').classList.remove('show');
    document.getElementById('msg-err').classList.add('show');
  }
  function showOk(t) {
    document.getElementById('ok-txt').textContent = t;
    document.getElementById('msg-err').classList.remove('show');
    document.getElementById('msg-ok').classList.add('show');
  }

  async function save() {
    var btn = document.getElementById('save-btn');
    hideMsg();

    var email = document.getElementById('inp-email').value.trim();
    var pass  = document.getElementById('inp-pass').value;
    var url   = document.getElementById('inp-url').value.trim();

    if (!email || !pass) { showErr('Email and password are required.'); return; }

    btn.disabled = true;
    btn.classList.add('is-loading');

    try {
      var res = await window.electronAPI.saveConfig({ email: email, password: pass, dashboardUrl: url });
      if (res.success) {
        btn.classList.remove('is-loading');
        document.getElementById('save-lbl').textContent = '✓ Connected!';
        showOk('Agent is running and controlling your lights.');
      } else {
        btn.classList.remove('is-loading');
        btn.disabled = false;
        showErr(res.error || 'Sign in failed. Check your credentials.');
      }
    } catch(e) {
      btn.classList.remove('is-loading');
      btn.disabled = false;
      showErr('Unexpected error: ' + (e.message || e));
    }
  }

  document.addEventListener('keydown', function(e) {
    if (e.key === 'Enter' && !document.getElementById('save-btn').disabled) save();
  });
</script>
</body>
</html>
